<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>NETY</title>
    <!-- The NETY mark: a three-node graph laid across a dashed segment boundary. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M12.5 2v20' stroke='%2394a3b8' stroke-opacity='0.75' stroke-width='2' stroke-linecap='round' stroke-dasharray='2 3'/%3E%3Cpath d='M5 7v10M5 7l14 5M5 17l14-5' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='5' cy='7' r='2.9' fill='%2338bdf8'/%3E%3Ccircle cx='5' cy='17' r='2.9' fill='%2338bdf8'/%3E%3Ccircle cx='19' cy='12' r='2.9' fill='%2338bdf8'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('nety.theme')
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
