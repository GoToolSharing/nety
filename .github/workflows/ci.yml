name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.cache/*'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Tests with the race detector
        run: go test -race ./...

      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux  GOARCH=amd64 go build ./...
          GOOS=linux  GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

  # The release pipeline is the only way anyone gets a binary, so a change
  # that breaks it must fail here rather than on the day a tag is pushed.
  release-dry-run:
    name: Release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the interface
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build the binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags '-s -w' -o nety ./cmd/nety

      - name: It runs, and it serves the interface it embedded
        run: |
          ./nety version
          test -s internal/server/dist/index.html

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Formatting
        working-directory: web
        run: npm run format:check

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build
